name: Matrix CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # fail-fast: false ensures all combinations run to completion,
    # giving full visibility of results across every environment.
    # This is critical for a compatibility matrix where we need to see
    # all failures, not just the first one.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
        experimental: [false]
        include:
          - os: ubuntu-latest
            node: 24
            experimental: true
          - os: windows-latest
            node: 24
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - name: Print environment info for debugging
        run: |
          node --version
          npm --version
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
